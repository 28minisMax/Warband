<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warband">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8e8e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="description" content="A phone-first warband sheet for Forbidden Psalm.">
<meta property="og:title" content="Warband Sheet">
<meta property="og:description" content="A phone-first warband sheet for Forbidden Psalm.">
<meta property="og:image" content="https://28minismax.github.io/Warband/icon-512.png">
<meta property="og:url" content="https://28minismax.github.io/Warband/">
<title>Warband Sheet</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
@font-face { font-family: "UnifrakturCook"; font-weight: 700; font-style: normal; font-display: swap; src: url("unifrakturcook-latin-700-normal.woff2") format("woff2"); }
@font-face { font-family: "Pirata One"; font-weight: 400; font-style: normal; font-display: swap; src: url("pirata-one-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Crimson Pro"; font-weight: 400; font-style: normal; font-display: swap; src: url("crimson-pro-latin-400-normal.woff2") format("woff2"); }
@font-face { font-family: "Crimson Pro"; font-weight: 600; font-style: normal; font-display: swap; src: url("crimson-pro-latin-600-normal.woff2") format("woff2"); }

/* Layout: one character per screen, thumb-reachable bottom tabs, a pinned XP/gold bar, stepper tiles for stats, ink-blot labels over rough-edged boxes. */
:root {
  --bg: #e8e8e6;
  --ink: #0f0f0f;
  --bar: #cdcdca;
  --rule: #9a9a97;
  --field: #f6f6f4;
  --muted: #5c5c59;
  --blood: #8a1717;
  --display: "UnifrakturCook", "Pirata One", "Old English Text MT", Georgia, serif;
  --numeral: "Pirata One", "UnifrakturCook", Georgia, serif;
  --body: "Crimson Pro", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --ink: #ecebe6; --bar: #2b2b29; --rule: #5a5a56;
    --field: #1b1b1a; --muted: #a3a29c; --blood: #c8402f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --ink: #ecebe6; --bar: #2b2b29; --rule: #5a5a56;
  --field: #1b1b1a; --muted: #a3a29c; --blood: #c8402f; color-scheme: dark;
}
[hidden] { display: none !important; }
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px;
  padding: 0 0 calc(88px + env(safe-area-inset-bottom, 0px)); min-height: 100%;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin-inline: auto; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 18px; }

/* pinned XP / gold bar */
.purse {
  position: sticky; top: 0; z-index: 6; background: var(--bg); border-bottom: 3px solid var(--ink);
  padding: env(safe-area-inset-top, 0px) 16px 0;
}
.purse-in { max-width: 560px; margin-inline: auto; display: flex; align-items: center; gap: 8px; min-height: 56px; padding-block: 5px; }
.chip {
  display: flex; align-items: baseline; gap: 8px; flex: none; min-height: 46px; padding: 4px 14px 6px; cursor: pointer; touch-action: manipulation;
  background: var(--field); color: var(--ink); border: 2.5px solid var(--ink); border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px;
}
.chip:active { background: var(--ink); color: var(--bg); }
.chip .cl { font-family: var(--display); font-size: 20px; line-height: 1; }
.chip .cv { font-family: var(--numeral); font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.status { flex: 1; min-width: 0; text-align: right; font-size: 12px; line-height: 1.2; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status b { color: var(--blood); font-weight: 600; }

/* ink blot labels */
.blot {
  background: var(--ink); color: var(--bg); font-family: var(--display); line-height: 1;
  padding: 10px 22px 12px; display: inline-block; min-width: 0;
  clip-path: polygon(2% 22%, 6% 6%, 12% 16%, 20% 0, 28% 12%, 40% 2%, 52% 14%, 64% 0, 76% 12%, 88% 3%, 96% 16%, 100% 36%, 97% 54%, 100% 72%, 94% 88%, 86% 100%, 74% 90%, 62% 100%, 50% 92%, 38% 100%, 26% 90%, 14% 100%, 6% 88%, 2% 70%, 0 50%);
}
.blot .cap { font-size: 1.45em; }

.masthead { padding-bottom: 14px; border-bottom: 4px solid var(--ink); border-radius: 0 0 40px 6px / 0 0 5px 2px; }
.mrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mrow .blot { font-size: 24px; flex: none; }
.line {
  flex: 1; min-width: 0; width: 100%; background: transparent; color: var(--ink);
  border: 0; border-bottom: 2px solid var(--rule); border-radius: 0; padding: 8px 2px;
  font: 600 20px/1.2 var(--body); min-height: 44px;
}

/* controls */
input, textarea, button { font-family: var(--body); color: var(--ink); }
input[type=text], input[type=search], textarea { font-size: 18px; }
.box {
  background: var(--field); border: 2.5px solid var(--ink);
  border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px; padding: 10px 12px; width: 100%; min-width: 0;
}
textarea.box { resize: none; line-height: 1.35; min-height: 96px; display: block; overflow: hidden; }
.field-label { font-family: var(--display); font-size: 22px; line-height: 1; margin: 0 0 6px; display: block; }
.field-label .cap { font-size: 1.35em; }
.field-label small { font-family: var(--display); font-size: 15px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--blood); outline-offset: 2px; }
.line:focus, .box:focus { outline: 3px solid var(--blood); outline-offset: 1px; }

.namebar {
  display: flex; align-items: center; gap: 10px; background: var(--bar);
  border: 3px solid var(--ink); border-radius: 3px 8px 3px 9px / 8px 3px 9px 3px; padding: 4px 12px;
}
.namebar .field-label { margin: 0; font-size: 24px; flex: none; }
.namebar input { flex: 1; min-width: 0; background: transparent; border: 0; font: 600 22px/1.2 var(--body); padding: 10px 2px; min-height: 48px; }
.panel.is-fallen .namebar input { text-decoration: line-through; text-decoration-thickness: 2px; }
.panel.is-fallen .portrait img { filter: grayscale(1); }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--field); border: 2.5px solid var(--ink); border-radius: 3px 8px 4px 9px / 8px 3px 9px 4px; padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.stat .nm { font-family: var(--display); font-size: 22px; line-height: 1; }
.stat .ctl { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 4px; }
.val { font-family: var(--numeral); font-size: 42px; line-height: 1; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.step {
  width: 48px; height: 48px; flex: none; border: 2.5px solid var(--ink); background: var(--bg);
  border-radius: 50% 44% 52% 46%; font: 700 28px/1 var(--numeral); display: grid; place-items: center; padding: 0; cursor: pointer;
  touch-action: manipulation;
}
.step:active { background: var(--ink); color: var(--bg); }

.vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
.vital { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vital .art { position: relative; width: 112px; max-width: 100%; aspect-ratio: 120 / 112; }
.vital svg { width: 100%; height: 100%; display: block; overflow: visible; }
.plate {
  position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 58%; min-height: 40px;
  background: var(--field); border: 2px solid var(--ink); border-radius: 5px; text-align: center;
  font: 700 24px/1 var(--numeral); padding: 6px 2px; font-variant-numeric: tabular-nums;
}
.plate.sm { font-size: 19px; padding-block: 9px; }
.plate.zero { color: var(--blood); border-color: var(--blood); }
.plate.shield { top: 42%; border: 0; background: transparent; }
.plate:focus { outline: 3px solid var(--blood); }
.hpctl { display: flex; align-items: center; gap: 10px; }
.hpctl .step { width: 44px; height: 44px; font-size: 24px; }

.hands { display: flex; flex-direction: column; gap: 10px; }
.hand { display: grid; grid-template-columns: auto 1fr 76px; gap: 8px; align-items: center; }
.hand .field-label { margin: 0; font-size: 26px; min-width: 62px; }
.hand input { min-height: 48px; }

.two { display: grid; grid-template-columns: 1fr; gap: 14px; }
.items { display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; align-items: center; gap: 8px; }
.item span { font-family: var(--display); font-size: 20px; width: 1.4em; text-align: right; flex: none; }
.item input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1.5px solid var(--rule); border-radius: 0; padding: 10px 2px; min-height: 46px; font-size: 18px; }
.item input:focus { outline: none; border-bottom: 3px solid var(--blood); }

.panel { display: flex; flex-direction: column; gap: 18px; }
.sect-head { display: flex; align-items: center; gap: 10px; }
.sect-head .blot { font-size: 24px; }

/* portrait */
.idrow { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; align-items: start; }
.idrow .vitals { gap: 6px; }
.idrow .vital .field-label { font-size: 19px; }
.portrait-wrap { position: relative; }
.portrait {
  display: grid; place-items: center; position: relative; overflow: hidden; cursor: pointer; text-align: center;
  width: 100%; aspect-ratio: 4 / 5; background: var(--bar); border: 3px solid var(--ink);
  border-radius: 3px 8px 4px 9px / 8px 3px 9px 4px; color: var(--ink);
}
.portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .ph { font-family: var(--display); font-size: 20px; line-height: 1.1; padding: 8px; }
.portrait .ph small { display: block; font-family: var(--body); font-size: 13px; color: var(--muted); margin-top: 4px; }
.portrait input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.portrait:focus-within { outline: 3px solid var(--blood); outline-offset: 2px; }

.toprow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: -6px; }
.backlink {
  background: transparent; border: 0; padding: 0 8px 0 0; min-height: 44px;
  font-family: var(--display); font-size: 20px; color: var(--ink); cursor: pointer; touch-action: manipulation;
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;
}
.fallenbtn {
  min-height: 44px; padding: 4px 16px 6px; cursor: pointer; touch-action: manipulation; background: transparent;
  border: 2.5px solid var(--ink); border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px; font-family: var(--display); font-size: 19px; line-height: 1;
}
.fallenbtn[aria-pressed="true"] { background: var(--blood); border-color: var(--blood); color: #fff; }

/* dialogs (bottom sheets) */
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 20; }
.sheet {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 21; background: var(--bg); border-top: 4px solid var(--ink);
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px;
  max-width: 560px; margin-inline: auto; max-height: 92vh; overflow-y: auto;
}
.sheet button {
  min-height: 52px; border: 2.5px solid var(--ink); background: var(--field); border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px;
  font: 600 19px var(--body); cursor: pointer; touch-action: manipulation;
}
.sheet button:active { background: var(--ink); color: var(--bg); }
.sheet .danger { color: var(--blood); border-color: var(--blood); }
.qgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qgrid button { font-family: var(--numeral); font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.amtrow { display: grid; grid-template-columns: minmax(0, 1fr) auto auto auto; gap: 8px; }
.amtrow input { min-height: 52px; font-size: 20px; font-variant-numeric: tabular-nums; }
.amtrow button { padding-inline: 14px; }

/* warband roster */
.tragedy { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; background: var(--field); border: 2.5px solid var(--ink); border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px; padding: 6px 10px 6px 14px; }
.tragedy .tl { margin: 0; }
.tctl { display: flex; align-items: center; gap: 10px; }
.tctl .step { width: 40px; height: 40px; font-size: 22px; }
.tnum { font-family: var(--numeral); font-size: 32px; line-height: 1; min-width: 1.6ch; text-align: center; font-variant-numeric: tabular-nums; }
.restbtn { flex: 1 1 100%; min-height: 48px; margin: 2px 0 6px; border: 2.5px solid var(--ink); background: transparent; border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px; font: 600 18px var(--body); cursor: pointer; touch-action: manipulation; }
.restbtn:active { background: var(--ink); color: var(--bg); }
.resetbtn, .actbtn { min-height: 52px; font: 600 17px var(--body); padding: 8px 14px; cursor: pointer; touch-action: manipulation; border-radius: 8px; }
.resetbtn { border: 2.5px dashed var(--rule); background: transparent; color: var(--muted); }
.resetbtn:active { border-color: var(--blood); color: var(--blood); }
.actbtn { border: 2.5px solid var(--ink); background: var(--field); border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px; }
.actbtn:active { background: var(--ink); color: var(--bg); }
.reset-q { font-family: var(--display); font-size: 27px; line-height: 1.15; margin: 0; text-wrap: balance; }
.reset-sub { margin: 0; color: var(--muted); font-size: 16px; }
.reset-sub.warn { color: var(--blood); font-weight: 600; }
.bgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.backup { display: flex; flex-direction: column; gap: 10px; }
.notescell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.notebox { position: relative; aspect-ratio: 4 / 5; width: 100%; }
.notebox textarea { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; overflow: auto; border-width: 3px; padding: 10px; font-size: 17px; }
.nlabel { font-family: var(--display); font-size: 24px; line-height: 1.05; }
.scrolls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.scrolls .blot { font-size: 20px; padding: 8px 16px 10px; }
.roster { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; }
.tile { display: flex; flex-direction: column; gap: 6px; text-align: left; background: transparent; border: 0; padding: 0; cursor: pointer; min-width: 0; touch-action: manipulation; }
.tile .pic {
  position: relative; aspect-ratio: 4 / 5; width: 100%; overflow: hidden; display: grid; place-items: center;
  border: 3px solid var(--ink); border-radius: 3px 8px 4px 9px / 8px 3px 9px 4px; background: var(--bar);
}
.tile:active .pic { outline: 3px solid var(--blood); }
.tile .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .no { font-family: var(--display); font-size: 56px; line-height: 1; color: var(--muted); }
.tile .tn { font-family: var(--display); font-size: 24px; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .tm { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .ts { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.tile.fallen .pic { opacity: .55; }
.tile.fallen .pic img { filter: grayscale(1); }
.tile.fallen .tn { text-decoration: line-through; text-decoration-thickness: 2px; }
.tile.fallen .tm { color: var(--blood); }

/* bottom tabs (scroll sideways once there are more than five heroes) */
.tabs {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 5; background: var(--bg);
  border-top: 4px solid var(--ink); display: flex; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none;
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabs::-webkit-scrollbar { display: none; }
.tab {
  flex: 0 0 calc(100% / 6); min-width: 56px; background: transparent; border: 0; padding: 8px 2px; min-height: 58px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;
  touch-action: manipulation;
}
.tab .g { font-family: var(--display); font-size: 24px; line-height: 1; }
.tab .t { font-size: 13px; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); padding-inline: 2px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab[aria-selected="true"] .t { color: var(--bg); }

.toast {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(78px + env(safe-area-inset-bottom, 0px)); z-index: 10;
  max-width: min(92vw, 520px); background: var(--ink); color: var(--bg); padding: 10px 18px; cursor: pointer;
  border-radius: 4px 9px 5px 10px / 9px 4px 10px 5px; font-size: 16px; line-height: 1.25; text-align: center;
}
.toast.bad { background: var(--blood); color: #fff; }

@media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: no-preference) { .step { transition: background .12s, color .12s; } }
</style>
</head>
<body>
<header class="purse">
  <div class="purse-in">
    <button type="button" class="chip" id="chip-xp" data-adjust="xp"><span class="cl">XP</span><span class="cv" id="v-xp">0</span></button>
    <button type="button" class="chip" id="chip-gold" data-adjust="gold"><span class="cl">Gold</span><span class="cv" id="v-gold">0</span></button>
    <div class="status" id="status"></div>
  </div>
</header>
<main class="wrap" id="app">
  <section class="masthead" id="masthead" aria-label="Warband">
    <div class="mrow"><span class="blot"><span class="cap">W</span>arband</span><input class="line" id="warband" data-k="warband" type="text" autocomplete="off" aria-label="Warband name" placeholder="Name your warband"></div>
  </section>
  <div id="panels"></div>
</main>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sheet sections"></nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<!-- XP / gold adjuster -->
<div class="sheet-bg" id="adj-bg" hidden></div>
<div class="sheet" id="adj" role="dialog" aria-labelledby="adj-title" hidden>
  <p class="reset-q" id="adj-title"></p>
  <div class="qgrid">
    <button type="button" data-q="1">+1</button><button type="button" data-q="5">+5</button><button type="button" data-q="10">+10</button>
    <button type="button" data-q="-1">−1</button><button type="button" data-q="-5">−5</button><button type="button" data-q="-10">−10</button>
  </div>
  <div class="amtrow">
    <input class="box" id="adj-amt" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="Amount" aria-label="Custom amount">
    <button type="button" data-adj="take">Take</button><button type="button" data-adj="add">Add</button><button type="button" data-adj="set">Set</button>
  </div>
  <button type="button" id="adj-done">Done</button>
</div>

<!-- generic confirm -->
<div class="sheet-bg" id="cf-bg" hidden></div>
<div class="sheet" id="cf" role="alertdialog" aria-labelledby="cf-q" aria-describedby="cf-sub" hidden>
  <p class="reset-q" id="cf-q"></p>
  <p class="reset-sub" id="cf-sub"></p>
  <button type="button" id="cf-yes"></button>
  <button type="button" id="cf-no"></button>
</div>

<!-- portrait options -->
<div class="sheet-bg" id="sheet-bg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Portrait options" hidden>
  <button type="button" id="sheet-change">Choose a new photo</button>
  <button type="button" class="danger" id="sheet-remove">Remove photo</button>
  <button type="button" id="sheet-cancel">Cancel</button>
</div>
<input type="file" id="bk-file" accept=".json,application/json" hidden>

<script>
(function () {
  var MAXC = 12;
  var STATS = [["agility", "Agility"], ["presence", "Presence"], ["strength", "Strength"], ["toughness", "Toughness"]];
  var LS = "warband-sheet-v1", LS_TAB = "warband-sheet-tab", LS_PREV = "warband-sheet-prev", LS_BK = "warband-sheet-backup";
  var ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X", "XI", "XII"];
  var DAY = 86400000;

  function blank() {
    var s = { warband: "", xp: 0, gold: 0, count: 5, party: { scroll1: "", scroll2: "", calamity: "", equipment: "", notes: "" } };
    for (var i = 1; i <= MAXC; i++) {
      s["c" + i] = { name: "", agility: 0, presence: 0, strength: 0, toughness: 0, armour: "", hp: 0, maxhp: 0, tragedies: 0, fallen: false,
        right: "", right_dmg: "", left: "", left_dmg: "", feats: "", flaws: "", items: ["", "", "", "", "", "", "", ""] };
    }
    return s;
  }
  function merge(base, over) {
    if (!over || typeof over !== "object") return base;
    Object.keys(base).forEach(function (k) {
      var b = base[k], o = over[k];
      if (Array.isArray(b)) { if (Array.isArray(o)) b.forEach(function (_, i) { if (typeof o[i] === "string") b[i] = o[i]; }); }
      else if (b && typeof b === "object") merge(b, o);
      else if (o !== undefined && typeof o === typeof b) base[k] = o;
    });
    return base;

  /* portrait options */
  document.getElementById("sheet-change").addEventListener("click", function () {
    var c = sheetC; closeDlg(); if (c) document.getElementById(c + "-photo").click();
  });
  document.getElementById("sheet-remove").addEventListener("click", function () {
    var c = sheetC; closeDlg();
    if (c) { delete photos[c]; paintPhotos(); photoLocal(c); photoRemote(c); }
  });
  document.getElementById("sheet-cancel").addEventListener("click", closeDlg);

  /* ---------- XP and gold ---------- */
  var amtEl = document.getElementById("adj-amt");
  function paintAdj() { document.getElementById("adj-title").textContent = (adjKey === "xp" ? "XP" : "Gold") + ": " + state[adjKey]; }
  function openAdjust(key) { adjKey = key; amtEl.value = ""; paintAdj(); openDlg("adjust"); }
  function adjust(mode, amt) {
    var cur = state[adjKey], next = cur;
    if (mode === "add") next = cur + amt; else if (mode === "take") next = cur - amt; else next = amt;
    next = Math.max(0, Math.min(9999999, next));
    if (next === cur) return;
    state[adjKey] = next; paint(); touch();
  }
  function amtValue() { var n = parseInt(amtEl.value.replace(/[^\d]/g, ""), 10); return isNaN(n) ? null : n; }
  document.getElementById("adj-done").addEventListener("click", closeDlg);
  amtEl.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); var v = amtValue(); if (v != null) { adjust("add", v); amtEl.value = ""; } } });

  /* ---------- backup, restore, undo ---------- */
  function readPrev() {
    try {
      var p = JSON.parse(localStorage.getItem(LS_PREV) || "null");
      if (!p || typeof p.t !== "number" || !p.state) return null;
      if (Date.now() - p.t > 30 * DAY) { localStorage.removeItem(LS_PREV); return null; }
      return p;
    } catch (e) { return null; }
  }
  /* keep a copy of what's on screen so a wipe or restore can be undone */
  function stash() {
    try { localStorage.setItem(LS_PREV, JSON.stringify({ t: Date.now(), state: state, photos: photos })); return true; }
    catch (e) { return false; }
  }
  function ago(t) {
    var m = Math.round((Date.now() - t) / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + (m === 1 ? " minute ago" : " minutes ago");
    var h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
    var d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
  }
  function hasData() { return JSON.stringify(state) !== JSON.stringify(blank()) || Object.keys(photos).length > 0; }
  function paintBackup() {
    var note = document.getElementById("backup-note"), t = 0;
    try { t = parseInt(localStorage.getItem(LS_BK) || "0", 10) || 0; } catch (e) {}
    var stale = hasData() && (!t || Date.now() - t > 14 * DAY);
    note.className = "reset-sub" + (stale ? " warn" : "");
    note.textContent = t ? "Last backup: " + ago(t) + ". Your sheet lives only in this browser." : "Never backed up. Your sheet lives only in this browser, so save a copy somewhere safe.";
    var prev = readPrev(), rb = document.getElementById("restore-open");
    rb.hidden = !prev;
    if (prev) rb.textContent = "Swap back to the previous warband (saved " + ago(prev.t) + ")";
  }
  function markBackup() { try { localStorage.setItem(LS_BK, String(Date.now())); } catch (e) {} paintBackup(); }
  function backupJson() { return JSON.stringify({ app: "warband-sheet", format: 2, saved: new Date().toISOString(), state: state, photos: photos }); }
  function backupName() {
    var slug = (state.warband || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "sheet";
    return "warband-" + slug + "-" + new Date().toISOString().slice(0, 10) + ".json";
  }
  async function saveBackup() {
    var json = backupJson(), name = backupName();
    try {
      var file = new File([json], name, { type: "application/json" });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: "Warband backup" }); markBackup(); return; }
    } catch (e) { if (e && e.name === "AbortError") return; }
    var url = URL.createObjectURL(new Blob([json], { type: "application/json" })), a = document.createElement("a");
    a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
    markBackup(); toast("Backup saved");
  }
  async function copyBackup() {
    var json = backupJson(), ok = false;
    try { await navigator.clipboard.writeText(json); ok = true; } catch (e) {}
    if (!ok) {
      try { var ta = document.createElement("textarea"); ta.value = json; ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); ok = document.execCommand("copy"); ta.remove(); } catch (e) {}
    }
    if (ok) { markBackup(); toast("Backup copied. Paste it somewhere safe."); } else toast("Couldn't copy. Use Save backup file instead.", true);
  }
  function applyState(ns, np) {
    var old = Object.keys(photos);
    state = fromRaw(ns);
    photos = {};
    Object.keys(np || {}).forEach(function (c) {
      var m = /^c(\d+)$/.exec(c);
      if (m && +m[1] >= 1 && +m[1] <= MAXC && typeof np[c] === "string" && np[c].indexOf("data:image/") === 0 && np[c].length < 900000) photos[c] = np[c];
    });
    lsSave();
    var all = {}; old.concat(Object.keys(photos)).forEach(function (c) { all[c] = 1; });
    var full = true;
    Object.keys(all).forEach(function (c) { if (!photoLocal(c)) full = false; });
    buildTabs(); paint(); paintPhotos(); showTab(validTab(tab) ? tab : "band"); touch();
    Object.keys(all).forEach(function (c) { photoRemote(c); });
    if (!full) setStatus("Some photos are too big to keep on this device", true);
  }
  async function importObject(obj) {
    if (!obj || obj.app !== "warband-sheet" || !obj.state || typeof obj.state !== "object") { toast("That isn't a Warband backup.", true); return; }
    var ok = await confirmSheet({ q: "Replace this warband with the backup?", sub: "What's on screen now is kept for 30 days, so you can swap back.", yes: "Restore backup", no: "Keep what I have", danger: true });
    if (!ok) return;
    if (!stash()) { toast("Not enough room to keep an undo copy. Save a backup file first.", true); return; }
    applyState(obj.state, obj.photos); toast("Backup restored");
  }
  document.getElementById("bk-save").addEventListener("click", saveBackup);
  document.getElementById("bk-copy").addEventListener("click", copyBackup);
  document.getElementById("bk-load").addEventListener("click", function () { document.getElementById("bk-file").click(); });
  document.getElementById("bk-file").addEventListener("change", function (e) {
    var f = e.target.files && e.target.files[0]; e.target.value = "";
    if (!f) return;
    if (f.size > 25 * 1024 * 1024) { toast("That file is too big to be a backup.", true); return; }
    var r = new FileReader();
    r.onload = function () { var o = null; try { o = JSON.parse(r.result); } catch (err) {} importObject(o); };
    r.onerror = function () { toast("Couldn't read that file.", true); };
    r.readAsText(f);
  });
  document.getElementById("bk-paste").addEventListener("click", async function () {
    var txt = ""; try { txt = await navigator.clipboard.readText(); } catch (e) { toast("Couldn't read the clipboard. Use Restore from file.", true); return; }
    var o = null; try { o = JSON.parse(txt); } catch (e) {}
    importObject(o);
  });
  document.getElementById("restore-open").addEventListener("click", async function () {
    var prev = readPrev(); if (!prev) { paintBackup(); return; }
    var ok = await confirmSheet({ q: "Raise the old warband from the grave?", sub: "It swaps places with what's on screen now. Do it again to swap back.", yes: "Raise them", no: "Leave them buried", danger: false });
    if (!ok) return;
    var cur = { t: Date.now(), state: state, photos: photos };
    try { localStorage.setItem(LS_PREV, JSON.stringify(cur)); } catch (e) { toast("Not enough room to swap. Save a backup file first.", true); return; }
    applyState(prev.state, prev.photos); toast("Previous warband restored");
  });

  /* ---------- new warband ---------- */
  var QUESTIONS = [
    "Wipe the slate? It was never clean.",
    "Bury them all? Nobody is coming to mourn.",
    "Begin again? The marsh does not care either way.",
    "Erase the whole warband? They were always going to die.",
    "Burn it down? Fire is the only honest accountant.",
    "Start over? Every ending is just a rough draft of the next one.",
    "Forget them? The dead are used to it.",
    "Throw it all away? Gold is only slow dirt."
  ];
  var lastQ = -1;
  document.getElementById("reset-open").addEventListener("click", async function () {
    var i; do { i = Math.floor(Math.random() * QUESTIONS.length); } while (i === lastQ && QUESTIONS.length > 1);
    lastQ = i;
    var ok = await confirmSheet({ q: QUESTIONS[i], sub: "This wipes every hero, the party page and all photos. You can swap them back for the next 30 days.", yes: "Let them be forgotten", no: "Spare them", danger: true });
    if (!ok) return;
    if (!stash()) { toast("Not enough room to keep an undo copy. Save a backup file first.", true); return; }
    applyState(blank(), {}); showTab("band"); toast("Wiped. You can swap the old warband back below.");
  });

  document.getElementById("recruit").addEventListener("click", function () {
    if (state.count >= MAXC) return;
    state.count++; buildTabs(); paint(); showTab("c" + state.count); touch();
  });

  /* ---------- events ---------- */
  document.addEventListener("input", function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute("data-k");
    if (!k) return;
    setPath(k, el.value);
    if (el.tagName === "TEXTAREA") grow(el);
    if (/\.name$/.test(k)) paint();
    touch();
  });
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : e.target.parentNode;

    var lab = t.closest(".portrait");
    if (lab) {
      if (t.tagName === "INPUT") return;
      var inp = lab.querySelector("[data-photo]"), pc = inp && inp.getAttribute("data-photo");
      if (pc && photos[pc]) { e.preventDefault(); sheetC = pc; openDlg("portrait"); }
      return;
    }

    var b = t.closest("[data-step]");
    if (b) {
      var k = b.getAttribute("data-step"), d = parseInt(b.getAttribute("data-d"), 10), cur = getPath(k) || 0, next = cur + d;
      var cc = k.split(".")[0], h = state[cc];
      if (/\.hp$/.test(k)) { next = Math.max(0, next); if (h.maxhp > 0) next = Math.min(next, h.maxhp); }
      else if (/\.maxhp$/.test(k)) {
        next = Math.max(0, Math.min(999, next));
        /* first tap on a hero with no max yet: start from their current health instead of dragging it down to 1 */
        if (cur === 0 && d > 0 && h.hp > 0) next = Math.max(next, h.hp);
        if (cur === 0 && h.hp === 0 && next > 0) h.hp = next;
        else if (next > 0 && h.hp > next) h.hp = next;
      }
      else if (/\.tragedies$/.test(k)) next = Math.max(0, next);
      else next = Math.max(-9, Math.min(9, next));
      setPath(k, next); paint(); touch(); return;
    }

    var ad = t.closest("[data-adjust]");
    if (ad) { openAdjust(ad.getAttribute("data-adjust")); return; }
    var q = t.closest("[data-q]");
    if (q) { var qv = parseInt(q.getAttribute("data-q"), 10); adjust(qv >= 0 ? "add" : "take", Math.abs(qv)); return; }
    var aj = t.closest("[data-adj]");
    if (aj) { var v = amtValue(); if (v == null) { amtEl.focus(); return; } adjust(aj.getAttribute("data-adj"), v); amtEl.value = ""; return; }

    var fb = t.closest("[data-fallen]");
    if (fb) { var fc = fb.getAttribute("data-fallen"); state[fc].fallen = !state[fc].fallen; paint(); touch(); return; }
    var rb = t.closest("[data-rest]");
    if (rb) { var rc = state[rb.getAttribute("data-rest")]; rc.hp = rc.maxhp; paint(); touch(); return; }

    var tt = t.closest("[data-tab]");
    if (tt) showTab(tt.getAttribute("data-tab"));
  });

  /* tab bar: arrow keys */
  tabs.addEventListener("keydown", function (e) {
    var o = tabOrder(), i = o.indexOf(tab), j = -1;
    if (e.key === "ArrowRight") j = Math.min(o.length - 1, i + 1);
    else if (e.key === "ArrowLeft") j = Math.max(0, i - 1);
    else if (e.key === "Home") j = 0;
    else if (e.key === "End") j = o.length - 1;
    if (j < 0) return;
    e.preventDefault(); showTab(o[j]);
    var el = document.getElementById("t-" + o[j]); if (el) el.focus();
  });

  /* swipe left/right to move between the warband page and heroes */
  var sx = 0, sy = 0, st = 0, sOn = false;
  document.addEventListener("touchstart", function (e) {
    var t0 = e.touches[0];
    sOn = e.touches.length === 1 && !dlg && !!e.target.closest("#app") && !/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
    sx = t0.clientX; sy = t0.clientY; st = Date.now();
  }, { passive: true });
  document.addEventListener("touchend", function (e) {
    if (!sOn) return; sOn = false;
    var t0 = e.changedTouches[0], dx = t0.clientX - sx, dy = t0.clientY - sy;
    if (Date.now() - st > 700 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8) return;
    if (dx > 0 && sx < 24) return; /* leave the iOS back-swipe edge alone */
    if (window.getSelection && String(window.getSelection())) return;
    step(dx < 0 ? 1 : -1);
  }, { passive: true });

  window.addEventListener("resize", function () { document.querySelectorAll("#p-" + tab + " textarea").forEach(grow); });

  buildTabs(); paint(); paintPhotos(); showTab(tab);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { document.querySelectorAll("#p-" + tab + " textarea").forEach(grow); });

  /* offline support */
  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
  }

  /* ---------- account sync (optional, only inside Claude) ---------- */
  (async function () {
    if (!window.claude || !window.claude.use) { setStatus("Saved on this device only"); return; }
    try {
      var user = await window.claude.use("user"), db = await window.claude.use("db");
      var uid = user ? await user.id() : null;
      if (!db || !uid) { setStatus("Saved on this device only"); return; }
      var ref = db.doc("data/users/" + uid + "/sheet"), first = true;
      photoDb = db; photoUid = uid; loadPhotos();
      ref.onSnapshot(function (snap) {
        var remote = snap.exists ? snap.data() : null;
        if (first) {
          first = false; dbDoc = ref;
          if (remote && remote.state) {
            if (dirty) { /* local edits made before load win */ flush(); }
            else { state = fromRaw(remote.state); lsSave(); buildTabs(); paint(); showTab(validTab(tab) ? tab : "band"); }
            setStatus("Saved");
          } else {
            if (hasData()) flush(); else setStatus("Saved");
          }
          return;
        }
        if (snap.metadata.hasPendingWrites || dirty || inflight) return;
        var a = document.activeElement;
        if (a && /INPUT|TEXTAREA/.test(a.tagName)) return;
        if (remote && remote.state) {
          var nxt = fromRaw(remote.state);
          if (JSON.stringify(nxt) !== JSON.stringify(state)) { state = nxt; lsSave(); buildTabs(); paint(); showTab(validTab(tab) ? tab : "band"); }
        }
      }, function () { dbDoc = null; setStatus("Saved on this device only"); });
    } catch (e) { setStatus("Saved on this device only"); }
  })();
})();
</script>
</body>
</html>
