<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Warband">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
html { padding-top: env(safe-area-inset-top, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>Warband Sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=Pirata+One&family=Crimson+Pro:wght@400;600&display=swap">
<style>
/* Layout: one character per screen, thumb-reachable bottom tabs, stepper tiles for stats, ink-blot labels over rough-edged boxes. */
:root {
  --bg: #e8e8e6;
  --ink: #0f0f0f;
  --bar: #cdcdca;
  --rule: #9a9a97;
  --field: #f6f6f4;
  --muted: #5c5c59;
  --blood: #8a1717;
  --display: "UnifrakturCook", "Pirata One", "Old English Text MT", Georgia, serif;
  --numeral: "Pirata One", "UnifrakturCook", Georgia, serif;
  --body: "Crimson Pro", Georgia, "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121211; --ink: #ecebe6; --bar: #2b2b29; --rule: #5a5a56;
    --field: #1b1b1a; --muted: #a3a29c; --blood: #c8402f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121211; --ink: #ecebe6; --bar: #2b2b29; --rule: #5a5a56;
  --field: #1b1b1a; --muted: #a3a29c; --blood: #c8402f; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px;
  padding-inline: 16px; padding-block: 12px 96px; min-height: 100%;
  -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }

/* ink blot labels */
.blot {
  background: var(--ink); color: var(--bg); font-family: var(--display); line-height: 1;
  padding: 10px 22px 12px; display: inline-block; min-width: 0;
  clip-path: polygon(2% 22%, 6% 6%, 12% 16%, 20% 0, 28% 12%, 40% 2%, 52% 14%, 64% 0, 76% 12%, 88% 3%, 96% 16%, 100% 36%, 97% 54%, 100% 72%, 94% 88%, 86% 100%, 74% 90%, 62% 100%, 50% 92%, 38% 100%, 26% 90%, 14% 100%, 6% 88%, 2% 70%, 0 50%);
}
.blot.round { clip-path: none; border-radius: 50%; width: 64px; height: 64px; padding: 0; display: grid; place-items: center; font-size: 22px; flex: none; }
.blot .cap { font-size: 1.45em; }

.masthead { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; padding-bottom: 14px; border-bottom: 4px solid var(--ink); border-radius: 0 0 40px 6px / 0 0 5px 2px; }
.mrow { display: flex; align-items: center; gap: 10px; min-width: 0; }
.mrow.full { grid-column: 1 / -1; }
.mrow .blot { font-size: 24px; flex: none; }
.line {
  flex: 1; min-width: 0; width: 100%; background: transparent; color: var(--ink);
  border: 0; border-bottom: 2px solid var(--rule); border-radius: 0; padding: 8px 2px;
  font: 600 20px/1.2 var(--body); min-height: 44px;
}

/* controls */
input, textarea, button { font-family: var(--body); color: var(--ink); }
input[type=text], input[type=search], textarea { font-size: 18px; }
.box {
  background: var(--field); border: 2.5px solid var(--ink);
  border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px; padding: 10px 12px; width: 100%; min-width: 0;
}
textarea.box { resize: none; line-height: 1.35; min-height: 96px; display: block; overflow: hidden; }
.field-label { font-family: var(--display); font-size: 22px; line-height: 1; margin: 0 0 6px; display: block; }
.field-label .cap { font-size: 1.35em; }
.field-label small { font-family: var(--display); font-size: 15px; color: var(--muted); }
:focus-visible { outline: 3px solid var(--blood); outline-offset: 2px; }
.line:focus, .box:focus { outline: 3px solid var(--blood); outline-offset: 1px; }

.namebar {
  display: flex; align-items: center; gap: 10px; background: var(--bar);
  border: 3px solid var(--ink); border-radius: 3px 8px 3px 9px / 8px 3px 9px 3px; padding: 4px 12px;
}
.namebar .field-label { margin: 0; font-size: 24px; flex: none; }
.namebar input { flex: 1; min-width: 0; background: transparent; border: 0; font: 600 22px/1.2 var(--body); padding: 10px 2px; min-height: 48px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat { background: var(--field); border: 2.5px solid var(--ink); border-radius: 3px 8px 4px 9px / 8px 3px 9px 4px; padding: 8px 8px 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.stat .nm { font-family: var(--display); font-size: 22px; line-height: 1; }
.stat .ctl { display: flex; align-items: center; justify-content: space-between; width: 100%; gap: 4px; }
.val { font-family: var(--numeral); font-size: 42px; line-height: 1; min-width: 2ch; text-align: center; font-variant-numeric: tabular-nums; }
.step {
  width: 48px; height: 48px; flex: none; border: 2.5px solid var(--ink); background: var(--bg);
  border-radius: 50% 44% 52% 46%; font: 700 28px/1 var(--numeral); display: grid; place-items: center; padding: 0; cursor: pointer;
  touch-action: manipulation;
}
.step:active { background: var(--ink); color: var(--bg); }

.vitals { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; align-items: stretch; }
.vital { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vital .art { position: relative; width: 112px; max-width: 100%; aspect-ratio: 120 / 112; }
.vital svg { width: 100%; height: 100%; display: block; overflow: visible; }
.plate {
  position: absolute; left: 50%; top: 52%; transform: translate(-50%, -50%); width: 58%; min-height: 40px;
  background: var(--field); border: 2px solid var(--ink); border-radius: 5px; text-align: center;
  font: 700 24px/1 var(--numeral); padding: 6px 2px;
}
.plate.shield { top: 42%; border: 0; background: transparent; }
.plate:focus { outline: 3px solid var(--blood); }
.hpctl { display: flex; align-items: center; gap: 10px; }
.hpctl .step { width: 44px; height: 44px; font-size: 24px; }

.hands { display: flex; flex-direction: column; gap: 10px; }
.hand { display: grid; grid-template-columns: auto 1fr 76px; gap: 8px; align-items: center; }
.hand .field-label { margin: 0; font-size: 26px; min-width: 62px; }
.hand input { min-height: 48px; }

.two { display: grid; grid-template-columns: 1fr; gap: 14px; }
.items { display: flex; flex-direction: column; gap: 2px; }
.item { display: flex; align-items: center; gap: 8px; }
.item span { font-family: var(--display); font-size: 20px; width: 1.4em; text-align: right; flex: none; }
.item input { flex: 1; min-width: 0; background: transparent; border: 0; border-bottom: 1.5px solid var(--rule); border-radius: 0; padding: 10px 2px; min-height: 46px; font-size: 18px; }
.item input:focus { outline: none; border-bottom: 3px solid var(--blood); }

.panel[hidden] { display: none !important; }
.panel { display: flex; flex-direction: column; gap: 18px; }
.sect-head { display: flex; align-items: center; gap: 10px; }
.sect-head .blot { font-size: 24px; }

.openlink {
  align-self: flex-start; font-family: var(--display); font-size: 18px; color: var(--ink);
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;
  min-height: 44px; display: inline-flex; align-items: center; margin-top: -6px;
}
.openlink:active { color: var(--blood); }
.masthead[hidden], .openlink[hidden] { display: none; }

/* portrait */
.idrow { display: grid; grid-template-columns: 118px minmax(0, 1fr); gap: 12px; align-items: start; }
.idrow .vitals { gap: 6px; }
.idrow .vital .field-label { font-size: 19px; }
.portrait-wrap { position: relative; }
.portrait {
  display: grid; place-items: center; position: relative; overflow: hidden; cursor: pointer; text-align: center;
  width: 100%; aspect-ratio: 4 / 5; background: var(--bar); border: 3px solid var(--ink);
  border-radius: 3px 8px 4px 9px / 8px 3px 9px 4px; color: var(--ink);
}
.portrait img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.portrait .ph { font-family: var(--display); font-size: 20px; line-height: 1.1; padding: 8px; }
.portrait .ph small { display: block; font-family: var(--body); font-size: 13px; color: var(--muted); margin-top: 4px; }
.portrait input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.portrait:focus-within { outline: 3px solid var(--blood); outline-offset: 2px; }
.backlink {
  align-self: flex-start; background: transparent; border: 0; padding: 0 8px 0 0; min-height: 44px; margin-top: -6px;
  font-family: var(--display); font-size: 20px; color: var(--ink); cursor: pointer; touch-action: manipulation;
  text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 4px;
}
.sheet-bg { position: fixed; inset: 0; background: rgba(0, 0, 0, .5); z-index: 20; }
.sheet {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 21; background: var(--bg); border-top: 4px solid var(--ink);
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 10px;
  max-width: 560px; margin-inline: auto;
}
.sheet button {
  min-height: 52px; border: 2.5px solid var(--ink); background: var(--field); border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px;
  font: 600 19px var(--body); cursor: pointer; touch-action: manipulation;
}
.sheet .danger { color: var(--blood); border-color: var(--blood); }
.sheet[hidden], .sheet-bg[hidden] { display: none; }

/* warband roster */
.tragedy { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--field); border: 2.5px solid var(--ink); border-radius: 3px 7px 4px 8px / 7px 3px 8px 4px; padding: 6px 10px 6px 14px; }
.tragedy .tl { margin: 0; }
.tctl { display: flex; align-items: center; gap: 10px; }
.tctl .step { width: 40px; height: 40px; font-size: 22px; }
.tnum { font-family: var(--numeral); font-size: 32px; line-height: 1; min-width: 1.6ch; text-align: center; font-variant-numeric: tabular-nums; }
.resetbtn { border: 2.5px dashed var(--rule); background: transparent; border-radius: 8px; min-height: 52px; font: 600 17px var(--body); color: var(--muted); padding: 8px 14px; cursor: pointer; touch-action: manipulation; margin-top: 8px; }
.resetbtn:active { border-color: var(--blood); color: var(--blood); }
.reset-q { font-family: var(--display); font-size: 27px; line-height: 1.15; margin: 0; text-wrap: balance; }
.reset-sub { margin: 0; color: var(--muted); font-size: 16px; }
.notescell { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.notebox { position: relative; aspect-ratio: 4 / 5; width: 100%; }
.notebox textarea { position: absolute; inset: 0; width: 100%; height: 100%; min-height: 0; overflow: auto; border-width: 3px; padding: 10px; font-size: 17px; }
.nlabel { font-family: var(--display); font-size: 24px; line-height: 1.05; }
.scrolls { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; }
.scrolls .blot { font-size: 20px; padding: 8px 16px 10px; }
.roster { display: grid; grid-template-columns: 1fr 1fr; gap: 16px 14px; }
.tile { display: flex; flex-direction: column; gap: 6px; text-align: left; background: transparent; border: 0; padding: 0; cursor: pointer; min-width: 0; touch-action: manipulation; }
.tile .pic {
  position: relative; aspect-ratio: 4 / 5; width: 100%; overflow: hidden; display: grid; place-items: center;
  border: 3px solid var(--ink); border-radius: 3px 8px 4px 9px / 8px 3px 9px 4px; background: var(--bar);
}
.tile:active .pic { outline: 3px solid var(--blood); }
.tile .pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.tile .no { font-family: var(--display); font-size: 56px; line-height: 1; color: var(--muted); }
.tile .tn { font-family: var(--display); font-size: 24px; line-height: 1.05; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tile .tm { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .ts { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* bottom tabs */
.tabs {
  position: fixed; inset-inline: 0; bottom: 0; z-index: 5; background: var(--bg);
  border-top: 4px solid var(--ink); display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  background: transparent; border: 0; padding: 8px 2px 8px; min-height: 58px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer;
  touch-action: manipulation;
}
.tab .g { font-family: var(--display); font-size: 24px; line-height: 1; }
.tab .t { font-size: 12px; line-height: 1.1; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); padding-inline: 2px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.tab[aria-selected="true"] .t { color: var(--bg); }
.status { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 4px); right: 10px; font-size: 13px; color: var(--muted); font-family: var(--body); pointer-events: none; }
.status b { color: var(--blood); font-weight: 600; }

@media (min-width: 560px) { .two { grid-template-columns: 1fr 1fr; } }
@media (prefers-reduced-motion: no-preference) { .step { transition: background .12s, color .12s; } }
</style>
</head>
<body>
<div class="status" id="status" aria-live="polite"></div>
<main class="wrap" id="app">
  <section class="masthead" id="masthead" aria-label="Warband">
    <div class="mrow full"><span class="blot"><span class="cap">W</span>arband</span><input class="line" id="warband" data-k="warband" type="text" autocomplete="off" aria-label="Warband name" placeholder="Name your warband"></div>
    <div class="mrow"><span class="blot"><span class="cap">X</span>P</span><input class="line" id="xp" data-k="xp" type="text" inputmode="numeric" autocomplete="off" aria-label="Party XP" placeholder="0"></div>
    <div class="mrow"><span class="blot round">Gold</span><input class="line" id="gold" data-k="gold" type="text" inputmode="numeric" autocomplete="off" aria-label="Gold" placeholder="0"></div>
  </section>
  <div id="panels"></div>
</main>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sheet sections"></nav>
<div class="sheet-bg" id="reset-bg" hidden></div>
<div class="sheet" id="reset-sheet" role="alertdialog" aria-labelledby="reset-q" hidden>
  <p class="reset-q" id="reset-q"></p>
  <p class="reset-sub">This wipes every hero, the party page and all photos.</p>
  <button type="button" class="danger" id="reset-yes">Let them be forgotten</button>
  <button type="button" id="reset-no">Spare them</button>
</div>
<div class="sheet-bg" id="sheet-bg" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Portrait options" hidden>
  <button type="button" id="sheet-change">Choose a new photo</button>
  <button type="button" class="danger" id="sheet-remove">Remove photo</button>
  <button type="button" id="sheet-cancel">Cancel</button>
</div>

<script>
(function () {
  var STATS = [["agility", "Agility"], ["presence", "Presence"], ["strength", "Strength"], ["toughness", "Toughness"]];
  var LS = "warband-sheet-v1", LS_TAB = "warband-sheet-tab";
  var ROMAN = ["I", "II", "III", "IV", "V"];

  function blank() {
    var s = { warband: "", xp: "", gold: "", party: { scroll1: "", scroll2: "", calamity: "", equipment: "", notes: "" } };
    for (var i = 1; i <= 5; i++) {
      s["c" + i] = { name: "", agility: 0, presence: 0, strength: 0, toughness: 0, armour: "", hp: 0, tragedies: 0,
        right: "", right_dmg: "", left: "", left_dmg: "", feats: "", flaws: "", items: ["", "", "", "", "", "", "", ""] };
    }
    return s;
  }
  function merge(base, over) {
    if (!over || typeof over !== "object") return base;
    Object.keys(base).forEach(function (k) {
      var b = base[k], o = over[k];
      if (Array.isArray(b)) { if (Array.isArray(o)) b.forEach(function (_, i) { if (typeof o[i] === "string") b[i] = o[i]; }); }
      else if (b && typeof b === "object") merge(b, o);
      else if (o !== undefined && typeof o === typeof b) base[k] = o;
    });
    return base;
  }
  function getPath(p) { return p.split(".").reduce(function (o, k) { return o == null ? o : o[k]; }, state); }
  function setPath(p, v) {
    var parts = p.split("."), o = state;
    for (var i = 0; i < parts.length - 1; i++) o = o[parts[i]];
    o[parts[parts.length - 1]] = v;
  }

  var state = blank();
  try { var raw = localStorage.getItem(LS); if (raw) merge(state, JSON.parse(raw)); } catch (e) {}

  /* ---------- build ---------- */
  var panels = document.getElementById("panels"), tabs = document.getElementById("tabs");

  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;"); }

  var SHIELD = '<svg viewBox="0 0 120 112" aria-hidden="true"><path d="M14 8 C40 14 50 8 60 16 C70 8 80 14 106 8 L102 58 C98 84 78 98 60 106 C42 98 22 84 18 58 Z" fill="var(--field)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/></svg>';
  var HEART = '<svg viewBox="0 0 120 112" aria-hidden="true">' +
    '<path d="M60 102 C6 62 18 12 60 40 C102 12 114 62 60 102 Z" fill="var(--field)" stroke="var(--ink)" stroke-width="4" stroke-linejoin="round"/>' +
    '<g transform="rotate(40 60 58)">' +
    '<path d="M60 108 L55 92 L55 38 L65 38 L65 92 Z" fill="var(--field)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>' +
    '<path d="M60 44 L60 90" stroke="var(--ink)" stroke-width="1.5"/>' +
    '<path d="M42 36 C46 31 74 31 78 36 C74 40 46 40 42 36 Z" fill="var(--ink)"/>' +
    '<circle cx="41" cy="36" r="3" fill="var(--ink)"/><circle cx="79" cy="36" r="3" fill="var(--ink)"/>' +
    '<rect x="56" y="14" width="8" height="22" fill="var(--field)" stroke="var(--ink)" stroke-width="3"/>' +
    '<path d="M56 19 L64 22 M56 25 L64 28 M56 31 L64 34" stroke="var(--ink)" stroke-width="1.5"/>' +
    '<circle cx="60" cy="10" r="5.5" fill="var(--ink)"/></g>' +
    '<g stroke="var(--blood)" stroke-width="2.6" stroke-linecap="round"><path d="M32 94 L32 104"/><path d="M38 92 L38 99"/><path d="M26 91 L26 97"/></g>' +
    '<circle cx="32" cy="106" r="2.4" fill="var(--blood)"/></svg>';

  function charPanel(n) {
    var c = "c" + n;
    var stats = STATS.map(function (s) {
      return '<div class="stat"><span class="nm">' + s[1] + '</span><div class="ctl">' +
        '<button type="button" class="step" data-step="' + c + '.' + s[0] + '" data-d="-1" aria-label="Decrease ' + s[1] + '">−</button>' +
        '<span class="val" id="' + c + '-' + s[0] + '-v" data-show="' + c + '.' + s[0] + '" aria-live="polite"></span>' +
        '<button type="button" class="step" data-step="' + c + '.' + s[0] + '" data-d="1" aria-label="Increase ' + s[1] + '">+</button></div></div>';
    }).join("");
    var items = "";
    for (var i = 0; i < 8; i++) {
      items += '<div class="item"><span>' + (i + 1) + '.</span><input id="' + c + '-item' + i + '" data-k="' + c + '.items.' + i + '" type="text" autocomplete="off" aria-label="Item ' + (i + 1) + '"></div>';
    }
    function hand(key, label) {
      return '<div class="hand"><label class="field-label" for="' + c + '-' + key + '"><span class="cap">' + label[0] + '</span>' + label.slice(1) + '</label>' +
        '<input class="box" id="' + c + '-' + key + '" data-k="' + c + '.' + key + '" type="text" autocomplete="off" placeholder="Weapon">' +
        '<input class="box" id="' + c + '-' + key + '_dmg" data-k="' + c + '.' + key + '_dmg" type="text" autocomplete="off" aria-label="' + label + ' damage" placeholder="d6"></div>';
    }
    return '<section class="panel" id="p-' + c + '" role="tabpanel" hidden>' +
      '<button type="button" class="backlink" data-tab="band">\u2039 Warband</button>' +
      '<div class="namebar"><label class="field-label" for="' + c + '-name"><span class="cap">N</span>ame:</label><input id="' + c + '-name" data-k="' + c + '.name" type="text" autocomplete="off" placeholder="Who is this?"></div>' +
      '<div class="idrow">' +
      '<div class="portrait-wrap"><label class="portrait" for="' + c + '-photo"><img id="' + c + '-img" alt="Portrait of hero ' + n + '" hidden>' +
        '<span class="ph" id="' + c + '-ph">Add portrait<small>Tap to choose a photo</small></span>' +
        '<input type="file" accept="image/*" id="' + c + '-photo" data-photo="' + c + '" aria-label="Choose a portrait photo for hero ' + n + '"></label>' +
        '</div>' +
      '<div class="vitals">' +
        '<div class="vital"><span class="field-label">Armour</span><div class="art">' + SHIELD +
          '<input class="plate shield" id="' + c + '-armour" data-k="' + c + '.armour" type="text" autocomplete="off" aria-label="Armour" placeholder="–"></div></div>' +
        '<div class="vital"><span class="field-label">Health</span><div class="art">' + HEART +
          '<div class="plate" id="' + c + '-hp-v" data-show="' + c + '.hp" aria-live="polite"></div></div>' +
          '<div class="hpctl"><button type="button" class="step" data-step="' + c + '.hp" data-d="-1" aria-label="Lose 1 health">−</button>' +
          '<button type="button" class="step" data-step="' + c + '.hp" data-d="1" aria-label="Gain 1 health">+</button></div></div>' +
      '</div></div>' +
      '<div class="stats">' + stats + '</div>' +
      '<div class="tragedy"><span class="field-label tl"><span class="cap">T</span>ragedies</span><div class="tctl">' +
        '<button type="button" class="step" data-step="' + c + '.tragedies" data-d="-1" aria-label="Remove a tragedy">\u2212</button>' +
        '<span class="tnum" data-show="' + c + '.tragedies" aria-live="polite"></span>' +
        '<button type="button" class="step" data-step="' + c + '.tragedies" data-d="1" aria-label="Add a tragedy">+</button></div></div>' +
      '<div class="hands">' + hand("right", "Right") + hand("left", "Left") + '</div>' +
      '<div class="two">' +
        '<div><label class="field-label" for="' + c + '-feats"><span class="cap">F</span>eats</label><textarea class="box" id="' + c + '-feats" data-k="' + c + '.feats" placeholder="Feats"></textarea></div>' +
        '<div><label class="field-label" for="' + c + '-flaws"><span class="cap">F</span>laws <small>&amp; Injury</small></label><textarea class="box" id="' + c + '-flaws" data-k="' + c + '.flaws" placeholder="Flaws and injuries"></textarea></div>' +
      '</div>' +
      '<div><span class="field-label"><span class="cap">I</span>tems</span><div class="items">' + items + '</div></div>' +
    '</section>';
  }

  function partyBlocks() {
    function blk(key, label, rows) {
      return '<div><div class="sect-head"><span class="blot"><span class="cap">' + label[0] + '</span>' + label.slice(1) + '</span></div>' +
        '<textarea class="box" style="margin-top:10px;min-height:' + rows + 'px" id="party-' + key + '" data-k="party.' + key + '" aria-label="' + label + '"></textarea></div>';
    }
    return '<div class="scrolls">' + blk("scroll1", "Scroll", 84) + blk("scroll2", "Scroll", 84) + '</div>' +
      blk("calamity", "Calamity", 72) + blk("equipment", "Party Equipment", 120);
  }

  var html = '<section class="panel" id="p-band" role="tabpanel" hidden>' + partyBlocks() + '<div class="sect-head"><span class="blot"><span class="cap">H</span>eroes</span></div><div class="roster" id="roster"><div class="notescell" id="notescell"><div class="notebox"><textarea class="box" id="party-notes" data-k="party.notes" aria-label="Notes" placeholder="Notes"></textarea></div><label class="nlabel" for="party-notes">Notes</label></div></div><button type="button" class="resetbtn" id="reset-open">Start a new warband</button></section>';
  var th = '<button type="button" class="tab" role="tab" id="t-band" data-tab="band" aria-selected="false"><span class="g">\u2630</span><span class="t">Warband</span></button>';
  for (var n = 1; n <= 5; n++) {
    html += charPanel(n);
    th += '<button type="button" class="tab" role="tab" id="t-c' + n + '" data-tab="c' + n + '" aria-selected="false"><span class="g">' + ROMAN[n - 1] + '</span><span class="t" id="tl-c' + n + '"></span></button>';
  }
  panels.innerHTML = html; tabs.innerHTML = th;

  /* ---------- render ---------- */
  function grow(t) { if (t.id === "party-notes") return; t.style.height = "auto"; t.style.height = Math.max(t.scrollHeight + 4, 0) + "px"; }
  function fmt(v) { return v > 0 ? "+" + v : String(v); }

  function paint() {
    document.querySelectorAll("[data-k]").forEach(function (el) {
      var v = getPath(el.getAttribute("data-k"));
      if (document.activeElement !== el && el.value !== v) el.value = v == null ? "" : v;
      if (el.tagName === "TEXTAREA") grow(el);
    });
    document.querySelectorAll("[data-show]").forEach(function (el) {
      var k = el.getAttribute("data-show"), v = getPath(k);
      el.textContent = /\.(hp|tragedies)$/.test(k) ? String(v) : fmt(v);
    });
    for (var n = 1; n <= 5; n++) {
      var nm = (state["c" + n].name || "").trim();
      document.getElementById("tl-c" + n).textContent = nm ? nm.split(/\s+/)[0] : "Hero " + n;
    }
    paintRoster();
  }
  function paintRoster() {
    var r = document.getElementById("roster"); if (!r) return;
    Array.prototype.forEach.call(r.querySelectorAll(".tile"), function (x) { x.remove(); });
    var nc = document.getElementById("notescell");
    function mk(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
    for (var n = 1; n <= 5; n++) {
      var c = "c" + n, h = state[c], b = mk("button", "tile"); b.type = "button"; b.setAttribute("data-tab", c);
      var nm = (h.name || "").trim() || "Hero " + n;
      b.setAttribute("aria-label", "Open " + nm);
      var pic = mk("div", "pic");
      if (photos[c]) { var im = document.createElement("img"); im.src = photos[c]; im.alt = ""; pic.appendChild(im); }
      else pic.appendChild(mk("span", "no", ROMAN[n - 1]));
      b.appendChild(pic);
      b.appendChild(mk("div", "tn", nm));
      b.appendChild(mk("div", "tm", "HP " + h.hp + (h.armour ? "  \u00b7  Armour " + h.armour : "")));
      b.appendChild(mk("div", "ts", "Agi " + fmt(h.agility) + "  Pre " + fmt(h.presence) + "  Str " + fmt(h.strength) + "  Tou " + fmt(h.toughness)));
      if (h.tragedies > 0) b.appendChild(mk("div", "ts", "Tragedies " + h.tragedies));
      r.insertBefore(b, nc);
    }
  }

  var tab = "band";
  function showTab(t) {
    if (!document.getElementById("p-" + t)) t = "band";
    tab = t;
    var mh = document.getElementById("masthead"), ol = document.getElementById("openlink");
    if (mh) mh.hidden = t !== "band"; if (ol) ol.hidden = t !== "band";
    document.querySelectorAll(".panel").forEach(function (p) { p.hidden = p.id !== "p-" + t; });
    document.querySelectorAll(".tab").forEach(function (b) { b.setAttribute("aria-selected", b.getAttribute("data-tab") === t ? "true" : "false"); });
    try { localStorage.setItem(LS_TAB, t); } catch (e) {}
    document.querySelectorAll("#p-" + t + " textarea").forEach(grow);
    window.scrollTo(0, 0);
  }

  /* ---------- saving ---------- */
  var statusEl = document.getElementById("status"), dbDoc = null, timer = null, inflight = false, again = false, dirty = false;
  function setStatus(msg, warn) { statusEl.innerHTML = warn ? "<b>" + msg + "</b>" : msg; }
  function lsSave() { try { localStorage.setItem(LS, JSON.stringify(state)); } catch (e) {} }
  function touch() {
    dirty = true; lsSave(); setStatus("Saving…");
    clearTimeout(timer); timer = setTimeout(flush, 700);
  }
  async function flush() {
    if (!dbDoc) { dirty = false; setStatus("Saved on this device only"); return; }
    if (inflight) { again = true; return; }
    inflight = true; dirty = false;
    try { await dbDoc.set({ v: 1, state: JSON.parse(JSON.stringify(state)) }); setStatus("Saved"); }
    catch (e) { setStatus("Not saved to your account", true); }
    inflight = false;
    if (again || dirty) { again = false; flush(); }
  }

  /* ---------- portraits ---------- */
  var photos = {}, photoDb = null, photoUid = null;
  for (var pi = 1; pi <= 5; pi++) {
    try { var pv = localStorage.getItem(LS + "-ph-c" + pi); if (pv) photos["c" + pi] = pv; } catch (e) {}
  }
  function paintPhotos() {
    for (var n = 1; n <= 5; n++) {
      var c = "c" + n, img = document.getElementById(c + "-img"), has = !!photos[c];
      if (has) img.src = photos[c]; else img.removeAttribute("src");
      img.hidden = !has;
      document.getElementById(c + "-ph").hidden = has;
    }
    paintRoster();
  }
  function photoRef(c) { return photoDb && photoUid ? photoDb.doc("data/users/" + photoUid + "/portrait-" + c) : null; }
  function photoLocal(c) {
    try { if (photos[c]) localStorage.setItem(LS + "-ph-" + c, photos[c]); else localStorage.removeItem(LS + "-ph-" + c); return true; }
    catch (e) { return false; }
  }
  async function photoRemote(c) {
    var ref = photoRef(c); if (!ref) return;
    try {
      setStatus("Saving…");
      if (photos[c]) await ref.set({ img: photos[c] }); else await ref.delete();
      setStatus("Saved");
    } catch (e) { setStatus("Photo not saved to your account", true); }
  }
  function shrink(file, cb) {
    var url = URL.createObjectURL(file), im = new Image();
    im.onload = function () {
      var W = 400, H = 500, cv = document.createElement("canvas"); cv.width = W; cv.height = H;
      var g = cv.getContext("2d"), s = Math.max(W / im.naturalWidth, H / im.naturalHeight);
      var w = im.naturalWidth * s, h = im.naturalHeight * s;
      g.fillStyle = "#000"; g.fillRect(0, 0, W, H);
      g.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
      URL.revokeObjectURL(url);
      cb(cv.toDataURL("image/jpeg", 0.8));
    };
    im.onerror = function () { URL.revokeObjectURL(url); setStatus("That photo could not be read", true); };
    im.src = url;
  }
  function setPhoto(c, data) {
    photos[c] = data; paintPhotos();
    if (!photoLocal(c)) setStatus("Photo too big to keep on this device", true);
    photoRemote(c);
  }
  async function loadPhotos() {
    for (var n = 1; n <= 5; n++) {
      var c = "c" + n, ref = photoRef(c);
      try {
        var snap = await ref.get(), d = snap.exists ? snap.data() : null;
        if (d && typeof d.img === "string" && d.img.indexOf("data:image/") === 0) {
          if (!photos[c]) { photos[c] = d.img; photoLocal(c); paintPhotos(); }
        } else if (photos[c]) { photoRemote(c); }
      } catch (e) {}
    }
  }
  document.addEventListener("change", function (e) {
    var el = e.target, c = el.getAttribute && el.getAttribute("data-photo");
    if (!c || !el.files || !el.files[0]) return;
    var f = el.files[0]; el.value = "";
    shrink(f, function (data) { setPhoto(c, data); });
  });
  /* tap a portrait that already has a photo: choose change / remove / cancel */
  var sheetC = null, sheetEl = document.getElementById("sheet"), sheetBg = document.getElementById("sheet-bg");
  function openSheet(c) { sheetC = c; sheetEl.hidden = false; sheetBg.hidden = false; document.getElementById("sheet-change").focus(); }
  function closeSheet() { sheetEl.hidden = true; sheetBg.hidden = true; sheetC = null; }
  document.addEventListener("click", function (e) {
    var t = e.target.closest ? e.target : e.target.parentNode, lab = t.closest(".portrait");
    if (!lab) return;
    if (t.tagName === "INPUT") return;
    var inp = lab.querySelector("[data-photo]"), c = inp && inp.getAttribute("data-photo");
    if (c && photos[c]) { e.preventDefault(); openSheet(c); }
  });
  document.getElementById("sheet-change").addEventListener("click", function () {
    var c = sheetC; closeSheet(); if (c) document.getElementById(c + "-photo").click();
  });
  document.getElementById("sheet-remove").addEventListener("click", function () {
    var c = sheetC; closeSheet();
    if (c) { delete photos[c]; paintPhotos(); photoLocal(c); photoRemote(c); }
  });
  document.getElementById("sheet-cancel").addEventListener("click", closeSheet);
  sheetBg.addEventListener("click", closeSheet);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && sheetC) closeSheet(); });

  /* ---------- new warband ---------- */
  var QUESTIONS = [
    "Wipe the slate? It was never clean.",
    "Bury them all? Nobody is coming to mourn.",
    "Begin again? The marsh does not care either way.",
    "Erase the whole warband? They were always going to die.",
    "Burn it down? Fire is the only honest accountant.",
    "Start over? Every ending is just a rough draft of the next one.",
    "Forget them? The dead are used to it.",
    "Throw it all away? Gold is only slow dirt."
  ];
  var lastQ = -1, resetSheet = document.getElementById("reset-sheet"), resetBg = document.getElementById("reset-bg");
  function openReset() {
    var i; do { i = Math.floor(Math.random() * QUESTIONS.length); } while (i === lastQ && QUESTIONS.length > 1);
    lastQ = i; document.getElementById("reset-q").textContent = QUESTIONS[i];
    resetSheet.hidden = false; resetBg.hidden = false; document.getElementById("reset-no").focus();
  }
  function closeReset() { resetSheet.hidden = true; resetBg.hidden = true; }
  async function doReset() {
    closeReset();
    state = blank(); lsSave();
    var had = Object.keys(photos);
    photos = {}; had.forEach(function (c) { photoLocal(c); });
    paint(); paintPhotos(); showTab("band"); touch();
    for (var k = 0; k < had.length; k++) await photoRemote(had[k]);
  }
  document.getElementById("reset-open").addEventListener("click", openReset);
  document.getElementById("reset-no").addEventListener("click", closeReset);
  resetBg.addEventListener("click", closeReset);
  document.getElementById("reset-yes").addEventListener("click", doReset);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !resetSheet.hidden) closeReset(); });

  /* ---------- events ---------- */
  document.addEventListener("input", function (e) {
    var el = e.target, k = el.getAttribute && el.getAttribute("data-k");
    if (!k) return;
    setPath(k, el.value);
    if (el.tagName === "TEXTAREA") grow(el);
    if (/\.name$/.test(k)) paint();
    touch();
  });
  document.addEventListener("click", function (e) {
    var b = e.target.closest && e.target.closest("[data-step]");
    if (b) {
      var k = b.getAttribute("data-step"), d = parseInt(b.getAttribute("data-d"), 10), cur = getPath(k) || 0;
      var next = cur + d;
      if (/\.(hp|tragedies)$/.test(k)) next = Math.max(next, 0); else next = Math.max(-9, Math.min(9, next));
      setPath(k, next); paint(); touch(); return;
    }
    var t = e.target.closest && e.target.closest("[data-tab]");
    if (t) showTab(t.getAttribute("data-tab"));
  });
  window.addEventListener("resize", function () { document.querySelectorAll("#p-" + tab + " textarea").forEach(grow); });

  paint(); paintPhotos(); showTab(tab);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { document.querySelectorAll("#p-" + tab + " textarea").forEach(grow); });

  /* ---------- account sync (optional) ---------- */
  (async function () {
    if (!window.claude || !window.claude.use) { setStatus("Saved on this device only"); return; }
    try {
      var user = await window.claude.use("user"), db = await window.claude.use("db");
      var uid = user ? await user.id() : null;
      if (!db || !uid) { setStatus("Saved on this device only"); return; }
      var ref = db.doc("data/users/" + uid + "/sheet"), first = true;
      photoDb = db; photoUid = uid; loadPhotos();
      ref.onSnapshot(function (snap) {
        var remote = snap.exists ? snap.data() : null;
        if (first) {
          first = false; dbDoc = ref;
          if (remote && remote.state) {
            if (dirty) { /* local edits made before load win */ flush(); }
            else { state = merge(blank(), remote.state); lsSave(); paint(); }
            setStatus("Saved");
          } else {
            var hasLocal = JSON.stringify(state) !== JSON.stringify(blank());
            if (hasLocal) flush(); else setStatus("Saved");
          }
          return;
        }
        if (snap.metadata.hasPendingWrites || dirty || inflight) return;
        var a = document.activeElement;
        if (a && /INPUT|TEXTAREA/.test(a.tagName)) return;
        if (remote && remote.state && JSON.stringify(remote.state) !== JSON.stringify(state)) {
          state = merge(blank(), remote.state); lsSave(); paint();
        }
      }, function () { dbDoc = null; setStatus("Saved on this device only"); });
    } catch (e) { setStatus("Saved on this device only"); }
  })();
})();
</script>

</body>
</html>
